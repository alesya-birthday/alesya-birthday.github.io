<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Приглашение на День Рождения</title>

    <!-- Google Fonts for handwritten & serif styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

    <style>
        /* ───────── RESET & BASE ───────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url('img/background.jpg');
            background-repeat: repeat;
            background-size: 120px 120px;
            background-color: #e8e4df;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 10px 40px;
            font-family: 'Caveat', 'Georgia', cursive, serif;
            overflow-x: hidden;
        }

        /* ───────── PHONE CONTAINER ───────── */
        .phone-container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 250, 245, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 18px 16px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18), 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 245, 235, 0.5);
            transition: all 0.3s ease;
        }

        @media (min-width: 600px) {
            body {
                padding: 30px 20px 50px;
                align-items: center;
            }
            .phone-container {
                border-radius: 48px;
                padding: 24px 22px 36px;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.20), 0 10px 30px rgba(0, 0, 0, 0.06);
            }
        }

        /* ───────── BLOCK 1: COLLAGE ───────── */
        .collage-section {
            position: relative;
            width: 100%;
            margin-bottom: 28px;
            transition: opacity 0.6s ease;
        }

        /* Notebook paper */
        .notebook-paper {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4.2;
            background: #fcf9f5;
            background-image:
                repeating-linear-gradient(transparent,
                    transparent 27px,
                    rgba(180, 170, 160, 0.25) 27px,
                    rgba(180, 170, 160, 0.25) 28px),
                linear-gradient(90deg, rgba(255, 180, 180, 0.20) 28px, transparent 32px);
            background-size: 100% 28px, 100% 100%;
            box-shadow: 0 8px 28px rgba(80, 60, 40, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border-radius: 6px 6px 8px 8px;
            transform: rotate(-1.8deg);
            transition: transform 0.4s ease;
            overflow: visible;
            margin: 0 auto;
        }

        /* subtle torn edges via pseudo */
        .notebook-paper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 8px 8px 10px 10px;
            background: transparent;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(200, 185, 170, 0.30), 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        /* ─── POLAROID ─── */
        .polaroid-wrap {
            position: absolute;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(2.2deg) scale(1);
            width: 52%;
            z-index: 8;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            will-change: transform;
        }
        .polaroid-wrap:hover {
            transform: translate(-50%, -50%) rotate(2.2deg) scale(1.04);
        }
        .polaroid-wrap img {
            width: 100%;
            display: block;
            border-radius: 3px;
            filter: drop-shadow(0 6px 18px rgba(60, 40, 20, 0.18));
        }

        /* ─── TAPE (craft_paper) ─── */
        .tape {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-3deg);
            width: 32%;
            z-index: 5;
            opacity: 0;
            animation: tapeDrop 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
            filter: drop-shadow(0 2px 6px rgba(80, 50, 20, 0.15));
            pointer-events: none;
        }
        .tape img {
            width: 100%;
            display: block;
        }

        /* ─── DATE ─── */
        .collage-date {
            position: absolute;
            top: 14%;
            left: 50%;
            transform: translateX(-50%) rotate(1.5deg);
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: clamp(1.8rem, 8vw, 3.6rem);
            font-weight: 700;
            font-style: italic;
            color: #4a3a2e;
            letter-spacing: 4px;
            text-shadow: 0 2px 12px rgba(160, 120, 80, 0.15);
            z-index: 10;
            white-space: nowrap;
            opacity: 0;
            animation: fadeSlideUp 0.8s ease 0.1s forwards;
        }
        .collage-date span {
            background: rgba(255, 245, 235, 0.55);
            padding: 0 12px 4px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        /* ─── PUSH NOTIFICATION ─── */
        .push-notification {
            position: absolute;
            top: -8px;
            left: 6px;
            z-index: 20;
            max-width: 82%;
            background: rgba(30, 30, 35, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px 14px 14px 6px;
            padding: 10px 14px 10px 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.30), 0 2px 8px rgba(0, 0, 0, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: translateY(-120px) scale(0.92);
            opacity: 0;
            animation: pushIn 0.8s cubic-bezier(0.22, 1.8, 0.36, 1) 1.0s forwards;
            pointer-events: auto;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .push-notification:hover {
            transform: translateY(0px) scale(1.02) !important;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        }
        .push-notification .app-name {
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #8e8e93;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .push-notification .app-name .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34c759;
            flex-shrink: 0;
        }
        .push-notification .msg {
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #f5f5f7;
            line-height: 1.3;
            word-break: break-word;
        }
        .push-notification .msg strong {
            font-weight: 600;
            color: #fff;
        }
        .push-notification .time {
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            font-size: 10px;
            color: #6e6e73;
            text-align: right;
            margin-top: 2px;
        }

        /* ─── DECORATIVE ELEMENTS ─── */
        .deco {
            position: absolute;
            z-index: 5;
            opacity: 0;
            animation: floatUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
            user-select: none;
        }
        .deco img {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(60, 40, 20, 0.12));
        }
        /* floating animation for some */
        .deco.float {
            animation: floatUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                gentleFloat 3.8s ease-in-out infinite 1.2s;
        }

        /* positions */
        .deco-cake {
            bottom: 4%;
            right: 0%;
            width: 28%;
            z-index: 9;
            animation-delay: 0.35s;
        }
        .deco-cake img {
            filter: drop-shadow(0 6px 20px rgba(80, 50, 30, 0.18));
        }

        .deco-sundae {
            bottom: 22%;
            left: -4%;
            width: 22%;
            z-index: 6;
            animation-delay: 0.40s;
        }

        .deco-ribbon {
            bottom: 2%;
            left: 2%;
            width: 30%;
            z-index: 4;
            animation-delay: 0.30s;
            transform-origin: center;
        }
        .deco-ribbon img {
            filter: drop-shadow(0 2px 8px rgba(200, 100, 120, 0.15));
        }

        .deco-gift {
            top: 12%;
            right: 2%;
            width: 16%;
            z-index: 7;
            animation-delay: 0.45s;
        }

        .deco-pion1 {
            top: 8%;
            left: 0%;
            width: 20%;
            z-index: 3;
            animation-delay: 0.50s;
        }
        .deco-pion2 {
            bottom: 32%;
            right: -2%;
            width: 18%;
            z-index: 3;
            animation-delay: 0.55s;
        }
        .deco-pion3 {
            top: 52%;
            left: -6%;
            width: 22%;
            z-index: 2;
            animation-delay: 0.60s;
        }

        /* ───────── BLOCK 2: FORM ───────── */
        .form-section {
            width: 100%;
            margin-top: 8px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeSlideUp 0.8s ease 0.6s forwards;
        }

        .form-paper {
            background: #fcf9f5;
            background-image:
                repeating-linear-gradient(transparent,
                    transparent 26px,
                    rgba(180, 170, 160, 0.18) 26px,
                    rgba(180, 170, 160, 0.18) 27px);
            background-size: 100% 27px;
            border-radius: 12px 12px 16px 16px;
            padding: 28px 18px 32px;
            box-shadow: 0 6px 24px rgba(80, 60, 40, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(200, 185, 170, 0.25);
            transform: rotate(0.6deg);
            transition: transform 0.3s ease;
        }
        .form-paper:hover {
            transform: rotate(0.3deg);
        }

        .form-title {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-weight: 700;
            font-style: italic;
            font-size: clamp(1.2rem, 4.5vw, 1.8rem);
            color: #3d3229;
            line-height: 1.35;
            margin-bottom: 20px;
            padding-right: 4px;
            letter-spacing: 0.3px;
        }
        .form-title em {
            font-style: italic;
            color: #b35a6a;
        }

        /* ─── INPUT ─── */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4d3e32;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .name-input {
            width: 100%;
            font-family: 'Caveat', cursive;
            font-size: 1.2rem;
            font-weight: 400;
            color: #3d3229;
            background: transparent;
            border: none;
            border-bottom: 2.5px dashed #c9b5a4;
            padding: 6px 4px 4px 2px;
            outline: none;
            transition: border-color 0.3s ease, transform 0.2s ease;
            border-radius: 0;
        }
        .name-input:focus {
            border-bottom-color: #d4848a;
            transform: scale(1.01);
        }
        .name-input::placeholder {
            color: #b8a898;
            font-weight: 300;
            opacity: 0.7;
            font-size: 1rem;
        }

        /* ─── CHECKBOX OPTIONS ─── */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 18px 0 24px;
        }

        .option-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px 12px 14px;
            background: rgba(245, 238, 230, 0.50);
            border-radius: 14px;
            border: 2px solid transparent;
            transition: all 0.25s ease;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 1.05rem;
            font-weight: 400;
            color: #3d3229;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            position: relative;
        }
        .option-card:hover {
            background: rgba(240, 225, 215, 0.60);
            transform: translateX(4px);
        }
        .option-card input[type="checkbox"] {
            display: none;
        }
        .option-card .checkmark {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 2.5px solid #c9b5a4;
            background: #fcf9f5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            font-size: 14px;
            color: transparent;
            position: relative;
        }
        .option-card .checkmark::after {
            content: '✓';
            font-family: 'Georgia', serif;
            font-size: 16px;
            font-weight: 700;
            color: transparent;
            transition: color 0.2s ease;
        }
        .option-card input:checked+.checkmark {
            background: #f5d6d6;
            border-color: #d4848a;
            box-shadow: 0 0 0 3px rgba(212, 132, 138, 0.15);
        }
        .option-card input:checked+.checkmark::after {
            color: #b35a6a;
        }
        .option-card input:checked~.option-text {
            color: #4d2e2e;
        }
        .option-card.checked {
            background: #fcecec;
            border-color: #e8b8b8;
            box-shadow: 0 4px 16px rgba(212, 132, 138, 0.12);
        }
        .option-card .option-text {
            flex: 1;
            line-height: 1.3;
            transition: color 0.2s ease;
        }
        .option-card .option-date {
            font-weight: 600;
            color: #7a5a4a;
        }
        .option-card .option-loc {
            font-weight: 300;
            color: #6a5a4a;
            font-size: 0.92rem;
        }

        /* ─── SUBMIT BUTTON ─── */
        .submit-btn {
            width: 100%;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: 1.4rem;
            padding: 14px 10px;
            background: #e8d5c8;
            color: #4d3a2e;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 14px rgba(180, 140, 110, 0.18);
            letter-spacing: 1px;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }
        .submit-btn:hover {
            transform: scale(1.03) translateY(-2px);
            background: #e0cabc;
            box-shadow: 0 8px 28px rgba(180, 140, 110, 0.25);
        }
        .submit-btn:active {
            transform: scale(0.96) translateY(0px);
        }
        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
            border-radius: 60px;
        }

        /* ─── SUCCESS MESSAGE ─── */
        .success-message {
            display: none;
            text-align: center;
            padding: 28px 12px 16px;
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            font-weight: 600;
            color: #4d3a2e;
            animation: popIn 0.6s cubic-bezier(0.22, 1.8, 0.36, 1) forwards;
        }
        .success-message .emoji-big {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 8px;
        }
        .success-message .sub {
            font-size: 1.1rem;
            font-weight: 400;
            color: #7a6a5a;
            margin-top: 4px;
        }

        .form-paper.submitted .form-fields {
            display: none;
        }
        .form-paper.submitted .success-message {
            display: block;
        }

        /* ───────── ANIMATIONS ───────── */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes tapeDrop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(-8deg) scale(0.6) translateY(-30px);
            }
            60% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-2deg) scale(1.05) translateY(4px);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-3deg) scale(1) translateY(0);
            }
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.80) rotate(6deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        @keyframes gentleFloat {
            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(1.5deg);
            }
        }

        @keyframes pushIn {
            0% {
                opacity: 0;
                transform: translateY(-120px) scale(0.88);
            }
            55% {
                opacity: 1;
                transform: translateY(8px) scale(1.02);
            }
            80% {
                transform: translateY(-4px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.70);
            }
            60% {
                transform: scale(1.08);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ───────── RESPONSIVE TWEAKS ───────── */
        @media (max-width: 420px) {
            .phone-container {
                padding: 12px 10px 20px;
                border-radius: 28px;
            }
            .notebook-paper {
                aspect-ratio: 3 / 4.4;
            }
            .push-notification {
                padding: 8px 12px 8px 10px;
                max-width: 88%;
                top: -4px;
                left: 4px;
            }
            .push-notification .msg {
                font-size: 12px;
            }
            .push-notification .app-name {
                font-size: 10px;
            }
            .collage-date {
                font-size: clamp(1.4rem, 6vw, 2.2rem);
                top: 12%;
            }
            .polaroid-wrap {
                width: 48%;
                top: 44%;
            }
            .tape {
                width: 28%;
                top: 30%;
            }
            .deco-cake {
                width: 24%;
            }
            .deco-sundae {
                width: 18%;
                bottom: 20%;
            }
            .deco-ribbon {
                width: 26%;
            }
            .deco-gift {
                width: 14%;
            }
            .deco-pion1 {
                width: 16%;
            }
            .deco-pion2 {
                width: 15%;
            }
            .deco-pion3 {
                width: 18%;
            }
            .option-card {
                padding: 10px 12px 10px 10px;
                font-size: 0.95rem;
                gap: 10px;
            }
            .option-card .checkmark {
                width: 20px;
                height: 20px;
                border-radius: 6px;
            }
            .option-card .checkmark::after {
                font-size: 13px;
            }
            .form-paper {
                padding: 20px 14px 24px;
            }
            .form-title {
                font-size: clamp(1.0rem, 4vw, 1.4rem);
            }
        }

        @media (min-width: 600px) and (max-width: 900px) {
            .notebook-paper {
                aspect-ratio: 3 / 4;
            }
            .collage-date {
                font-size: clamp(2.2rem, 5vw, 3rem);
            }
        }

        /* support for prefers-reduced-motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .deco.float {
                animation: floatUp 0.5s ease forwards !important;
            }
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <!-- ═══ BLOCK 1: COLLAGE ═══ -->
        <section class="collage-section">
            <div class="notebook-paper" id="notebookPaper">

                <!-- Push Notification -->
                <div class="push-notification" id="pushNotification">
                    <div class="app-name">
                        <span class="dot"></span> MESSAGES
                    </div>
                    <div class="msg">
                        <strong>Алеська:</strong> мне 25, ураа!!
                    </div>
                    <div class="time">сейчас</div>
                </div>

                <!-- Date -->
                <div class="collage-date"><span>06.2026</span></div>

                <!-- Tape (craft_paper) -->
                <div class="tape">
                    <img src="img/craft_paper.png" alt="скотч" loading="lazy" />
                </div>

                <!-- Polaroid -->
                <div class="polaroid-wrap" id="polaroidWrap">
                    <img src="img/polaroid.png" alt="Polaroid" loading="lazy" />
                </div>

                <!-- ─── DECORATIVE ELEMENTS ─── -->
                <!-- Cake -->
                <div class="deco deco-cake float">
                    <img src="img/cake.png" alt="торт" loading="lazy" />
                </div>

                <!-- Sundae -->
                <div class="deco deco-sundae float">
                    <img src="img/sundae.png" alt="мороженое" loading="lazy" />
                </div>

                <!-- Ribbon -->
                <div class="deco deco-ribbon">
                    <img src="img/ribbon.png" alt="лента" loading="lazy" />
                </div>

                <!-- Gift -->
                <div class="deco deco-gift">
                    <img src="img/gift.png" alt="подарок" loading="lazy" />
                </div>

                <!-- Peonies -->
                <div class="deco deco-pion1">
                    <img src="img/pions.png" alt="пион" loading="lazy" />
                </div>
                <div class="deco deco-pion2">
                    <img src="img/pions_2.png" alt="пион" loading="lazy" />
                </div>
                <div class="deco deco-pion3">
                    <img src="img/pions_3.png" alt="пион" loading="lazy" />
                </div>

            </div>
        </section>

        <!-- ═══ BLOCK 2: FORM ═══ -->
        <section class="form-section">
            <div class="form-paper" id="formPaper">

                <div class="form-fields">
                    <div class="form-title">
                        Привет! Мой день рождения пройдет в трёх разных датах и локациях.<br />
                        <em>Отмечай все удобные для тебя дни!</em>
                    </div>

                    <!-- Name input -->
                    <div class="form-group">
                        <label for="guestName">Как тебя зовут?</label>
                        <input type="text" id="guestName" class="name-input"
                        placeholder="напиши здесь..." autocomplete="name" />
                    </div>

                    <!-- Options -->
                    <div class="options-grid" id="optionsGrid">
                        <label class="option-card" data-value="28 июня — Минск, ул. Аннаева">
                            <input type="checkbox" value="28 июня — Минск, ул. Аннаева" />
                            <span class="checkmark"></span>
                            <span class="option-text">
                                <span class="option-date">28 июня</span>
                                <span class="option-loc"> — Минск, ул. Аннаева</span>
                            </span>
                        </label>
                        <label class="option-card" data-value="29 июня — Минск, ул. Аннаева">
                            <input type="checkbox" value="29 июня — Минск, ул. Аннаева" />
                            <span class="checkmark"></span>
                            <span class="option-text">
                                <span class="option-date">29 июня</span>
                                <span class="option-loc"> — Минск, ул. Аннаева</span>
                            </span>
                        </label>
                        <label class="option-card" data-value="11 июля — аг. Федоры">
                            <input type="checkbox" value="11 июля — аг. Федоры" />
                            <span class="checkmark"></span>
                            <span class="option-text">
                                <span class="option-date">11 июля</span>
                                <span class="option-loc"> — аг. Федоры</span>
                            </span>
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="button" class="submit-btn" id="submitBtn">Подтвердить участие</button>
                </div>

                <!-- Success message (hidden initially) -->
                <div class="success-message" id="successMessage">
                    <span class="emoji-big">🎉</span>
                    Ура, выбор сохранен!<br />
                    До встречи на празднике! 🎉
                    <div class="sub">спасибо, что ты с нами ✨</div>
                </div>

            </div>
        </section>

    </div>

    <script>
        (function() {
            'use strict';

            /* ─── DOM refs ─── */
            const formPaper = document.getElementById('formPaper');
            const submitBtn = document.getElementById('submitBtn');
            const guestNameInput = document.getElementById('guestName');
            const optionCards = document.querySelectorAll('.option-card');
            const checkboxes = document.querySelectorAll('.option-card input[type="checkbox"]');

            /* ─── checkbox card styling (marker outline) ─── */
            function updateCardStyle(card, checked) {
                if (checked) {
                    card.classList.add('checked');
                } else {
                    card.classList.remove('checked');
                }
            }

            checkboxes.forEach((cb) => {
                const card = cb.closest('.option-card');
                // initial state
                if (cb.checked) {
                    card.classList.add('checked');
                }

                cb.addEventListener('change', function(e) {
                    updateCardStyle(card, this.checked);
                    // small haptic feedback via brief scale
                    card.style.transition = 'transform 0.12s ease';
                    card.style.transform = 'scale(0.97)';
                    setTimeout(() => {
                        card.style.transform = 'scale(1)';
                    }, 120);
                });

                // allow clicking the card to toggle
                card.addEventListener('click', function(e) {
                    // ignore if click was directly on the checkbox (it already toggles)
                    if (e.target.tagName === 'INPUT') return;
                    const cb = this.querySelector('input[type="checkbox"]');
                    cb.checked = !cb.checked;
                    cb.dispatchEvent(new Event('change'));
                });
            });

            /* ─── submit handler ─── */
            function submitForm(data) {
                /**
                 * ─── КУДА ПОДКЛЮЧИТЬ ОТПРАВКУ ───
                 * Здесь можно реализовать отправку данных:
                 *
                 * 1. Telegram Webhook:
                 *    fetch('https://api.telegram.org/bot<TOKEN>/sendMessage', {
                 *      method: 'POST',
                 *      headers: { 'Content-Type': 'application/json' },
                 *      body: JSON.stringify({
                 *        chat_id: '<CHAT_ID>',
                 *        text: `Новый гость: ${data.name}\nВыбранные даты: ${data.dates.join(', ')}`
                 *      })
                 *    });
                 *
                 * 2. Google Таблицы (Apps Script Webhook):
                 *    fetch('https://script.google.com/macros/s/.../exec', {
                 *      method: 'POST',
                 *      mode: 'no-cors',
                 *      headers: { 'Content-Type': 'application/json' },
                 *      body: JSON.stringify(data)
                 *    });
                 *
                 * 3. Email (через серверный endpoint):
                 *    fetch('/api/send-email', { method: 'POST', body: JSON.stringify(data) });
                 *
                 * Сейчас данные логируются в консоль для отладки.
                 */
                console.log('📨 Данные формы:', data);
                // Здесь вставь свой Webhook / API вызов
            }

            submitBtn.addEventListener('click', function() {
                // gather data
                const name = guestNameInput.value.trim() || 'Гость';
                const selected = [];
                document.querySelectorAll('.option-card input[type="checkbox"]:checked').forEach((cb) => {
                    selected.push(cb.value);
                });

                if (selected.length === 0) {
                    // gentle nudge: highlight options
                    const grid = document.getElementById('optionsGrid');
                    grid.style.transition = 'transform 0.15s ease';
                    grid.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        grid.style.transform = 'scale(1)';
                    }, 150);
                    // flash border on first option
                    const firstCard = document.querySelector('.option-card');
                    if (firstCard) {
                        firstCard.style.borderColor = '#d4848a';
                        firstCard.style.transition = 'border-color 0.3s ease';
                        setTimeout(() => {
                            firstCard.style.borderColor = 'transparent';
                        }, 600);
                    }
                    return;
                }

                // build data object
                const formData = {
                    name: name,
                    dates: selected,
                    timestamp: new Date().toISOString()
                };

                // call the submit function (with webhook placeholder)
                submitForm(formData);

                // transform form → success
                formPaper.classList.add('submitted');

                // optional: scroll to show success message
                setTimeout(() => {
                    formPaper.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
            });

            /* ─── Enter key on name input triggers submit ─── */
            guestNameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitBtn.click();
                }
            });

            /* ─── polaroid tap/click scale ─── */
            const polaroidWrap = document.getElementById('polaroidWrap');
            polaroidWrap.addEventListener('click', function() {
                // already has :hover scale, but we add a little pulse
                this.style.transition = 'transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)';
                this.style.transform = 'translate(-50%, -50%) rotate(2.2deg) scale(1.10)';
                setTimeout(() => {
                    this.style.transform = 'translate(-50%, -50%) rotate(2.2deg) scale(1)';
                }, 350);
            });

            /* ─── push notification close on click (optional) ─── */
            const pushNotif = document.getElementById('pushNotification');
            pushNotif.addEventListener('click', function() {
                this.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease';
                this.style.transform = 'translateY(-80px) scale(0.90)';
                this.style.opacity = '0';
                setTimeout(() => {
                    this.style.display = 'none';
                }, 450);
            });

            /* ─── small fix: ensure all decos with .float get proper animation ─── */
            // already handled via CSS

            console.log('🎂 Приглашение загружено! Y2K scrapbook style ✨');
        })();
    </script>

</body>
